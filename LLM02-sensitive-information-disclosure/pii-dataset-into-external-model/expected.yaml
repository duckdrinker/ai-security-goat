  # --- xygeni-product-backlog#1147: PII harmonization with shared SensitivityAnalyzer ---
  # F1-F3 test vocabulary NOT covered by the old bespoke PII_HINT regex
  # (pii|phi|ssn|hipaa|gdpr|personal_data|sensitive_data|social_security|credit_card|classification).
  # F4 is a control positive using the old regex's "classification:" pattern -- confirmed by the dev
  # (2026-10-02) to ALSO be gated behind #4496, not already-working as originally assumed in the ticket.
  # All four confirmed by the dev against a compiled build of xygeni/DepsDoctor#4496 (not merged yet) --
  # see the dataset_sensitivity value expected on each below.
  - detector: pii-dataset-into-external-model
    file: bad_passport_dob_dataset.py
    owaspLlm: "LLM02:2025"
    severity: critical
    confidence: high
    dataset_sensitivity: PII
    explanation: "Dataset filename encodes passport/DOB -- personal PII terms from the shared sensitivity catalog, invisible to the old bespoke regex -- fed to an external model with data_sharing_mode=train_on_prompts."
  - detector: pii-dataset-into-external-model
    file: bad_iban_cvv_dataset.py
    owaspLlm: "LLM02:2025"
    severity: critical
    confidence: high
    dataset_sensitivity: PCI
    explanation: "Dataset filename encodes IBAN/CVV -- financial PII terms from the shared sensitivity catalog, invisible to the old bespoke regex -- fed to an external model with data_sharing_mode=train_on_prompts."
  - detector: pii-dataset-into-external-model
    file: bad_mrn_ehr_dataset.py
    owaspLlm: "LLM02:2025"
    severity: critical
    confidence: high
    dataset_sensitivity: PHI
    explanation: "Dataset filename encodes MRN/EHR -- health PII terms beyond the old bespoke regex's patient|medical|health_record vocabulary -- fed to an external model with data_sharing_mode=train_on_prompts."
  - detector: pii-dataset-into-external-model
    file: bad_explicit_pii_classification.py
    owaspLlm: "LLM02:2025"
    severity: critical
    confidence: high
    dataset_sensitivity: PII
    explanation: "Control positive via the old regex's classification: pii trailing comment. Must keep triggering after the harmonization refactor; a regression here would mean the refactor narrowed detection instead of widening it."
pass:
  - file: good_finetune.py
  - file: good_embeddings.py
  - file: good_no_sensitive_dataset.py
    note: "Negative control -- no sensitive term anywhere. Guards against false positives from widening the shared sensitivity vocabulary. Confirmed correct (no finding) both before and after #4496."
  - file: good_pii_dataset_optout.py
    note: "Negative context -- same newly-recognized PII terms as bad_passport_dob_dataset.py, but data_sharing_mode=opt_out. Must not trigger. Confirmed correct (no finding) both before and after #4496."
