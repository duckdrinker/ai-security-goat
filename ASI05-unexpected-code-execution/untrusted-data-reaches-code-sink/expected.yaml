# xygeni/xygeni-product-backlog#1357, merged xygeni/DepsDoctor#4277
# (b936a735, aff6dd35, 96e087f0, 16f7a74a).
# Detector: TaintFlowDetector (id: untrusted-data-reaches-code-sink), Critical,
# both Phase-1.5a/1.5b and cross-file/JS-TS in scope -- nothing here deferred.
#
# Key semantic: AI-specific sources (untrusted_dataset, untrusted_model_source)
# create NEW findings. Generic sources (user_input/external_input/
# database_input/decoded_input, e.g. sys.argv/process.argv) only UPGRADE an
# existing SAST sink-present finding's confidence -- they never create a new
# one, and produce nothing at all if no SAST finding already exists on that
# sink.
#
# oversizedFile_isExcludedFromAnalysis (AISC-119) has no fixture here: a >5MB
# file isn't practical to commit. Generate one locally at execution time
# instead (e.g. a bad_dataset_to_pickle.py padded past 5MB with a comment
# block) and confirm it's skipped, rather than treating its absence as a gap.
