# xygeni/xygeni-product-backlog#1358, merged xygeni/DepsDoctor#4277 @ 208914f9.
# Detector: AgentSharedCredentialDetector, severity LOW (not Medium as the ticket
# said -- the platform's Severity enum has no Medium, Medium maps to low).
# This detector correlates across manifests, so each finding spans two files --
# using `files:` (plural) instead of the usual single `file:` key.
fail:
  - detector: tool-credential-shared-across-agents
    files: [bad_agent1_shared_ref.yaml, bad_agent2_shared_ref.yaml]
    severity: low
    confidence: medium
    explanation: "support-triage-agent and refund-processing-agent both reference connection_ref 'shared-credentials-prod' with no per-agent scope."
  - detector: tool-credential-shared-across-agents
    files: [bad_agent1_shared_literal.yaml, bad_agent2_shared_literal.yaml]
    severity: low
    confidence: medium
    explanation: "cache-warmer-agent and notification-dispatch-agent both hardcode the literal connection string 'redis://prod'."

