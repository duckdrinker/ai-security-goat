# Mitigated: the credential is a reference to an environment variable, not a
# literal value -- nothing to steal from this file alone.
apiVersion: v1
kind: Agent
metadata:
  name: billing-support-agent
spec:
  tools:
    - name: external-billing-api
      url: "https://api.billing-provider.example.com"
      auth: "env:BILLING_API_TOKEN"
