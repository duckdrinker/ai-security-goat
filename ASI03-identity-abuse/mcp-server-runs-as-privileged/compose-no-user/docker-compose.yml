# Triggers mcp-server-runs-as-privileged: MCP server service with no `user:`
# field -- runs as whatever the image's default user is (root, for most base
# images).
services:
  mcp-tools-server:
    image: internal-registry/mcp-tools-server:1.4.0
    command: ["python", "-m", "mcp_server.main"]
    ports:
      - "8765:8765"
