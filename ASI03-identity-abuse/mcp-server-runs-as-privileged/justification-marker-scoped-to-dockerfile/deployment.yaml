# Triggers mcp-server-runs-as-privileged: MCP server Deployment running as
# root, carrying the same justification marker that suppresses the Dockerfile
# USER root case -- must NOT be suppressed here, the escape is Dockerfile-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-tools-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-tools-server
  template:
    metadata:
      labels:
        app: mcp-tools-server
    spec:
      securityContext:
        runAsUser: 0 # justification: needs root
      containers:
        - name: mcp-tools-server
          image: internal-registry/mcp-tools-server:1.4.0
          command: ["python", "-m", "mcp_server.main"]
