# Triggers mcp-server-runs-as-privileged: MCP server service running as root,
# carrying the same justification marker that suppresses the Dockerfile
# USER root case -- must NOT be suppressed here, the escape is Dockerfile-only.
services:
  mcp-tools-server:
    image: internal-registry/mcp-tools-server:1.4.0
    command: ["python", "-m", "mcp_server.main"]
    user: root # justification: needs root
    ports:
      - "8765:8765"
